tudy material: \u003ci>\"Practice set 1 (sample)\"\u003c/i>, \u003ci>\"Mock test (sample)\"\u003c/i>.\u003c/p>\n \u003ch2 style=\"margin-top:26px\">Daily study planner\u003c/h2>\u003cform class=\"row\" id=\"tf\">\u003clabel class=\"sr\" for=\"tn\">New task\u003c/label>\u003cinput id=\"tn\" style=\"flex:1\" placeholder=\"e.g. Solve 20 percentage questions\">\u003cbutton class=\"btn\">Add task\u003c/button>\u003c/form>\u003cp class=\"err\" id=\"tn-e\" role=\"alert\">\u003c/p>\u003cdiv class=\"bar\" aria-hidden=\"true\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\u003cp id=\"pt\" role=\"status\">\u003c/p>\u003cul id=\"tl\" style=\"list-style:none;padding:0\">\u003c/ul>\u003c/div>\u003c/section>`);\n const draw=()=>{const t=get(\"gc_tasks\",[]),d=t.filter(x=>x.d).length;$(\"#pb\").style.width=(t.length?d/t.length*100:0)+\"%\";$(\"#pt\").textContent=`Progress: ${t.length?Math.round(d/t.length*100):0}% (${d}/${t.length} done)`;\n  $(\"#tl\").innerHTML=t.length?t.map((x,i)=>`\u003cli class=\"card row\" style=\"margin:8px 0;padding:10px 14px;justify-content:space-between\">\u003clabel style=\"margin:0\">\u003cinput type=\"checkbox\" style=\"width:auto\" data-i=\"${i}\" ${x.d?\"checked\":\"\"}> \u003cspan ${x.d?'style=\"text-decoration:line-through\"':\"\"}>${esc(x.t)}\u003c/span>\u003c/label>\u003cbutton class=\"btn sm out\" data-r=\"${i}\" aria-label=\"Remove task\">Remove\u003c/button>\u003c/li>`).join(\"\"):\"\u003cli>\"+empty(\"No tasks yet. Add your first study task above.\",\"\",\"\")+\"\u003c/li>\";\n  $$(\"[data-i]\").forEach(c=>c.onchange=()=>{const t=get(\"gc_tasks\",[]);t[c.dataset.i].d=c.checked;set(\"gc_tasks\",t);draw()});$$(\"[data-r]\").forEach(b=>b.onclick=()=>{const t=get(\"gc_tasks\",[]);t.splice(b.dataset.r,1);set(\"gc_tasks\",t);draw()})};\n $(\"#tf\").onsubmit=e=>{e.preventDefault();const v=$(\"#tn\").value.trim();$(\"#tn-e\").textContent=v?\"\":\"Please type a task first.\";if(!v)return;const t=get(\"gc_tasks\",[]);t.push({t:v,d:false});set(\"gc_tasks\",t);$(\"#tn\").value=\"\";draw()};draw();\n},\n\"career-guidance\"(){\n const C=[[\"\ud83c\udf92\",\"Jobs after 10th\",[\"Defence tradesman and some postal posts\",\"Some state and railway Group D posts\",\"Check age and physical rules in each notice\"]],[\"\ud83d\udcd8\",\"Jobs after 12th\",[\"Police constable\",\"SSC CHSL, railway and defence entries\",\"Some clerical posts\"]],[\"\ud83d\udee0\ufe0f\",\"Jobs after Diploma\",[\"Railway technician\",\"Junior engineer in some departments\",\"Nursing and paramedical posts\"]],[\"\ud83c\udf93\",\"Jobs after Graduation\",[\"Civil services, SSC CGL\",\"Banking PO/Clerk\",\"Revenue, teaching and state services\"]],[\"\u2699\ufe0f\",\"Engineering graduates\",[\"PSU engineer roles (often via GATE)\",\"Railway and state engineering services\",\"Defence technical entries\"]],[\"\ud83d\udee1\ufe0f\",\"Police careers\",[\"Constable, SI and higher services\",\"Written, physical and medical stages\",\"Stay fit and know the physical standards\"]],[\"\ud83d\udcdc\",\"Revenue / MRO pathway\",[\"State public service commission exams\",\"Group-level revenue posts\",\"Learn land records and local administration\"]],[\"\ud83c\udfe6\",\"Banking and Railway\",[\"Banking: IBPS, SBI exams\",\"Railway: RRB NTPC, Group D, JE\",\"Both use online exams with many applicants\"]]];\n const L=[[\"Age eligibility and relaxation\",\"Each post has its own age limit. Relaxation for some categories exists, but rules differ, so read the notice.\"],[\"How to apply\",\"1) Find the official notice 2) Check eligibility 3) Register 4) Upload documents 5) Pay fee 6) Save printout\"],[\"Preparation tips\",\"Know the syllabus, make a daily plan, practise mock tests, revise often, read current affairs daily.\"],[\"Common mistakes\",\"Missing the last date, wrong photo size, mismatched names in documents, using fake websites, skipping the notice.\"]];\n A(`\u003csection class=\"block\">\u003cdiv class=\"wrap\">\u003ch1>Career Guidance\u003c/h1>\u003cp class=\"notice\ j.id})});return n.sort((a,b)=>(b.r?1:0)-(a.r?1:0))}\nfunction initBell(){const b=$(\"#bell\");if(!b)return;const n=notes();$(\"#bn\").textContent=Math.max(0,n.length-get(\"gc_seen\",0))||\"\";\n b.onclick=()=>{let p=$(\"#np\");if(p){p.remove();return}p=document.createElement(\"div\");p.id=\"np\";p.className=\"np\";p.innerHTML=`\u003ch3>Upcoming exam notifications\u003c/h3>${n.map(x=>`\u003ca href=\"${x.h}\">${x.r?\"\ud83d\udd14 Reminder set \u00b7 \":\"\ud83d\udce2 \"}${esc(x.t)}\u003c/a>`).join(\"\")||'\u003cp class=\"muted\">Nothing new.\u003c/p>'}\u003cp class=\"muted\" style=\"font-size:.75rem\">Demo dates. Verify on official websites.\u003c/p>`;b.parentElement.append(p);set(\"gc_seen\",n.length);$(\"#bn\").textContent=\"\"}}\nfunction applyModal(id){const j=JOBS.find(x=>x.id===id),u=currentUser()||{};\n const warn=u.qual&&(RANK[u.qual]\u003cRANK[j.qual]||(j.qual===\"Engineering\"&&u.qual!==\"Engineering\"))?`\u003cdiv class=\"notice\">\u26a0\ufe0f Your profile qualification (${esc(u.qual)}) may not meet the minimum (${j.qual}). Check the official notice.\u003c/div>`:\"\";\n modal(`\u003ch2>Apply: ${esc(j.title)}\u003c/h2>\u003cp class=\"muted\">${esc(j.dept)} \u00b7 Last date (sample): ${fmt(j.end)}\u003c/p>${warn}\u003cp class=\"notice\">\u003cb>Demo only:\u003c/b> GovCareer cannot submit real applications. Apply on the official recruitment website after verifying the notification.\u003c/p>\u003ch3>Before you apply\u003c/h3>\u003cul class=\"check\">\u003cli>Qualification: ${j.qual}\u003c/li>\u003cli>Age: ${j.amin}\u2013${j.amax} years\u003c/li>\u003cli>Photo, signature and certificates ready\u003c/li>\u003cli>Valid email and mobile number\u003c/li>\u003c/ul>\u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"mk\">Mark as Applied (track here)\u003c/button>\u003ca class=\"btn out\" href=\"job-details.html?id=${id}\">View Details\u003c/a>\u003c/div>\u003cp id=\"am\" class=\"ok\" role=\"status\">\u003c/p>`);\n $(\"#mk\").onclick=()=>{const s=saved();if(!s.incl
